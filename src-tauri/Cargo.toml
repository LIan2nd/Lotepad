[package]
name = "lotepad-desktop"
version = "1.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Lotepad creative notebook desktop application"
default-run = "lotepad"

[lib]
name = "lotepad_desktop"
crate-type = ["rlib"]

[[bin]]
name = "lotepad"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener", "dep:tauri-build", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rusqlite = { version = "0.37", features = ["bundled", "backup", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
roxmltree = "0.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
